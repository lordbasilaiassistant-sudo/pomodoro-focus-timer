<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Focus Timer</title>
  <meta name="description" content="A Pomodoro timer with work, short-break and long-break cycles, and a running count of completed sessions for the day. Nothing to install.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://lordbasilaiassistant-sudo.github.io/pomodoro-focus-timer/">
  <meta property="og:title" content="Pomodoro Focus Timer">
  <meta property="og:description" content="A Pomodoro timer with work, short-break and long-break cycles, and a running count of completed sessions for the day. Nothing to install.">
  <meta property="og:image" content="https://lordbasilaiassistant-sudo.github.io/pomodoro-focus-timer/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Pomodoro Focus Timer — Twenty-five on, five off, and a count of the sessions you actually finished.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e63946 0%, #f1faee 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(230, 57, 70, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #e63946;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            justify-content: center;
        }
        .mode-btn {
            padding: 12px 24px;
            border: 2px solid #e63946;
            background: white;
            color: #e63946;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        .mode-btn:hover {
            background: #ffe5e9;
        }
        .mode-btn.active {
            background: #e63946;
            color: white;
        }
        .timer-display {
            font-size: 7em;
            font-weight: bold;
            color: #e63946;
            margin: 40px 0;
            font-family: 'Courier New', monospace;
        }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .control-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .start-btn {
            background: #2a9d8f;
            color: white;
        }
        .start-btn:hover {
            background: #238276;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(42, 157, 143, 0.4);
        }
        .pause-btn {
            background: #f4a261;
            color: white;
        }
        .pause-btn:hover {
            background: #e8944e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 162, 97, 0.4);
        }
        .reset-btn {
            background: #e63946;
            color: white;
        }
        .reset-btn:hover {
            background: #d62828;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(230, 57, 70, 0.4);
        }
        .stats {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
        }
        .stats h3 {
            color: #333;
            margin-bottom: 15px;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #dee2e6;
        }
        .stat-item:last-child {
            border-bottom: none;
        }
        .stat-label {
            color: #666;
        }
        .stat-value {
            color: #e63946;
            font-weight: bold;
        }
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #2a9d8f;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            display: none;
            animation: slideIn 0.3s;
        }
        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .progress-ring {
            transform: rotate(-90deg);
            margin: 0 auto 20px;
        }
        .progress-ring-circle {
            transition: stroke-dashoffset 1s linear;
            stroke: #e63946;
            stroke-width: 8;
            fill: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍅 Pomodoro Timer</h1>
        <p class="subtitle">Stay focused, work efficiently</p>
        
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="work" data-time="25">Work (25m)</button>
            <button class="mode-btn" data-mode="short" data-time="5">Short Break (5m)</button>
            <button class="mode-btn" data-mode="long" data-time="15">Long Break (15m)</button>
        </div>
        
        <svg class="progress-ring" width="120" height="120">
            <circle class="progress-ring-circle" r="52" cx="60" cy="60" stroke-dasharray="326.73" stroke-dashoffset="0"></circle>
        </svg>
        
        <div class="timer-display" id="timer">25:00</div>
        
        <div class="controls">
            <button class="control-btn start-btn" id="startBtn">▶️ Start</button>
            <button class="control-btn pause-btn" id="pauseBtn" style="display:none;">⏸️ Pause</button>
            <button class="control-btn reset-btn" id="resetBtn">🔄 Reset</button>
        </div>
        
        <div class="stats">
            <h3>Today's Stats</h3>
            <div class="stat-item">
                <span class="stat-label">Completed Pomodoros</span>
                <span class="stat-value" id="completedCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Total Focus Time</span>
                <span class="stat-value" id="totalTime">0 min</span>
            </div>
        </div>
    </div>
    
    <div class="notification" id="notification">Time's up! Take a break!</div>
    
    <script>
        let timeLeft = 25 * 60;
        let totalSeconds = 25 * 60;
        let timerId = null;
        let isRunning = false;
        let currentMode = 'work';
        let completedPomodoros = 0;
        let totalFocusTime = 0;
        
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const notification = document.getElementById('notification');
        const completedCount = document.getElementById('completedCount');
        const totalTimeDisplay = document.getElementById('totalTime');
        const progressCircle = document.querySelector('.progress-ring-circle');
        const modeButtons = document.querySelectorAll('.mode-btn');
        
        const circumference = 2 * Math.PI * 52;
        progressCircle.style.strokeDasharray = circumference;
        
        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            const progress = (totalSeconds - timeLeft) / totalSeconds;
            const offset = circumference * progress;
            progressCircle.style.strokeDashoffset = offset;
            
            if (timeLeft === 0) {
                clearInterval(timerId);
                isRunning = false;
                showNotification();
                playSound();
                
                if (currentMode === 'work') {
                    completedPomodoros++;
                    totalFocusTime += 25;
                    updateStats();
                }
                
                startBtn.style.display = 'block';
                pauseBtn.style.display = 'none';
            }
        }
        
        function startTimer() {
            if (!isRunning) {
                isRunning = true;
                startBtn.style.display = 'none';
                pauseBtn.style.display = 'block';
                
                timerId = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                }, 1000);
            }
        }
        
        function pauseTimer() {
            clearInterval(timerId);
            isRunning = false;
            startBtn.style.display = 'block';
            pauseBtn.style.display = 'none';
        }
        
        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            const activeMode = document.querySelector('.mode-btn.active');
            const minutes = parseInt(activeMode.dataset.time);
            timeLeft = minutes * 60;
            totalSeconds = minutes * 60;
            updateDisplay();
            startBtn.style.display = 'block';
            pauseBtn.style.display = 'none';
        }
        
        function showNotification() {
            notification.style.display = 'block';
            notification.textContent = currentMode === 'work' ? "Time's up! Take a break!" : "Break over! Time to focus!";
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
        
        function playSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }
        
        function updateStats() {
            completedCount.textContent = completedPomodoros;
            totalTimeDisplay.textContent = `${totalFocusTime} min`;
            localStorage.setItem('pomodoroStats', JSON.stringify({
                completed: completedPomodoros,
                totalTime: totalFocusTime
            }));
        }
        
        function loadStats() {
            const stats = JSON.parse(localStorage.getItem('pomodoroStats'));
            if (stats) {
                completedPomodoros = stats.completed || 0;
                totalFocusTime = stats.totalTime || 0;
                updateStats();
            }
        }
        
        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);
        
        modeButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                if (!isRunning) {
                    modeButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    currentMode = this.dataset.mode;
                    const minutes = parseInt(this.dataset.time);
                    timeLeft = minutes * 60;
                    totalSeconds = minutes * 60;
                    updateDisplay();
                }
            });
        });
        
        loadStats();
        updateDisplay();
    </script>
</body>
</html>
